<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRUD de tarefas</title>
<style>
  body{font-family:system-ui,sans-serif;background:#1e1e1e;color:#f5f5f5;max-width:560px;margin:2rem auto;padding:0 1rem}
  form{display:flex;gap:.5rem;margin-bottom:1rem}
  input{flex:1;padding:.6rem;border-radius:8px;border:1px solid #3a3a3a;background:#2d2d2d;color:inherit}
  button{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:.5rem .9rem;cursor:pointer}
  button:hover{background:#60a5fa}
  li{display:flex;gap:.5rem;align-items:center;background:#2d2d2d;padding:.6rem .8rem;border-radius:8px;margin:.4rem 0;list-style:none}
  li span{flex:1} li.done span{text-decoration:line-through;opacity:.6}
  .sec{background:#3a3a3a}
</style></head>
<body>
<h1>Tarefas</h1>
<form id="f"><input id="t" placeholder="Nova tarefa" required maxlength="120"><button>Adicionar</button></form>
<ul id="lista"></ul>
<script>
  // CRUD: Create, Read, Update, Delete com persistência em localStorage
  const KEY = 'tarefas';
  let tarefas = JSON.parse(localStorage.getItem(KEY) || '[]');
  const salvar = () => localStorage.setItem(KEY, JSON.stringify(tarefas));

  function render() {                                   // READ
    const ul = document.getElementById('lista'); ul.innerHTML = '';
    if (!tarefas.length) ul.innerHTML = '<li><span>Nenhuma tarefa. Adicione a primeira acima.</span></li>';
    tarefas.forEach(t => {
      const li = document.createElement('li'); if (t.ok) li.className = 'done';
      const s = document.createElement('span'); s.textContent = t.texto;   // textContent evita XSS
      const b1 = btn(t.ok ? 'Reabrir' : 'Concluir', () => { t.ok = !t.ok; salvar(); render(); });
      const b2 = btn('Editar', () => { const n = prompt('Editar tarefa:', t.texto); if (n && n.trim()) { t.texto = n.trim(); salvar(); render(); } }); // UPDATE
      const b3 = btn('Excluir', () => { tarefas = tarefas.filter(x => x.id !== t.id); salvar(); render(); });       // DELETE
      li.append(s, b1, b2, b3); ul.appendChild(li);
    });
  }
  function btn(txt, fn) { const b = document.createElement('button'); b.type = 'button'; b.className = 'sec'; b.textContent = txt; b.onclick = fn; return b; }

  document.getElementById('f').addEventListener('submit', e => {   // CREATE
    e.preventDefault(); const i = document.getElementById('t');
    tarefas.push({ id: Date.now(), texto: i.value.trim(), ok: false });
    salvar(); i.value = ''; render();
  });
  render();
</script>
</body></html>
